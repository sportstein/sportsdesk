<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SportsDesk Spotting Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* SportsDesk spotting board: pregame prep that turns into a live reference at tip */
:root{
  --chair:#c41e1e; --desk:#1a5fa8; --ink:#07070f; --slate:#151522; --slate2:#1d1d2c; --line:#26263a;
  --chalk:#f3f1ea; --dim:#8b8ba3; --pencil:#ffcf33; --up:#5fd38d; --down:#ef8a7a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--chalk);font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;font-size:16px;font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.D{font-family:"Big Shoulders Display","Arial Narrow",sans-serif}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:20px;background:var(--chair);padding:2px 10px 1px}
.bar .t{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:20px}
.status{display:flex;align-items:center;gap:6px;color:var(--dim);font-weight:600}
.status i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.status.live i{background:#3ec46d;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.bar form{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--dim);font-weight:600}
.bar input{width:64px;background:var(--slate);border:1px solid var(--line);font-weight:700;padding:4px 8px;text-transform:uppercase}
.bar button,.pbtn{background:var(--desk);border:0;font-weight:700;padding:5px 12px;cursor:pointer}
.pbtn{background:var(--slate2)}

/* matchup line lives in the top bar */
.mu{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--dim);min-width:0;flex:1 1 auto}
.mu b{font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:21px;color:var(--chalk);display:inline-flex;align-items:center;gap:6px}
.mu b i{width:5px;height:18px;background:var(--tc)}
.mu .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:6px}
.bar form{margin-left:0}

/* layout: away roster | the desk | home roster */
.layout{display:grid;grid-template-columns:minmax(0,1fr) clamp(360px,28vw,440px) minmax(0,1fr);grid-template-areas:"away desk home";gap:14px;margin:12px 18px 30px;align-items:start}
.col.away{grid-area:away} .col.home{grid-area:home}
.desk{grid-area:desk;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.desk .alerts iframe{width:100%;height:340px;border:0;background:var(--ink);display:block}
.desk.has-detail .alerts iframe{height:190px}
/* with a player open, the score box pins to the top and the panel scrolls under it */
.desk.has-detail .alerts{position:sticky;top:0;z-index:3;align-self:start;box-shadow:0 8px 14px rgba(7,7,15,.85)}
.desk .box{padding:8px 12px}
.desk .box h3{font-size:15px;margin-bottom:3px}
@media (max-width:1279px){
  .layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"desk desk" "away home"}
  .desk{position:static;max-height:none;overflow:visible;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .desk .alerts{grid-row:span 3}
}
@media (max-width:860px){ .layout{grid-template-columns:1fr;grid-template-areas:"desk" "away" "home"} .desk{grid-template-columns:1fr} }
.box{background:var(--slate);padding:10px 12px}
.box h3{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:17px;color:var(--dim);margin-bottom:6px}
.l5{display:flex;flex-direction:column;gap:4px}
.l5 div{display:flex;gap:8px;align-items:center;font-weight:600;font-size:15px}
.l5 .tag{font-family:"Big Shoulders Display",sans-serif;font-weight:800;width:38px}
.wl{display:inline-flex;gap:3px}
.wl i{font-style:normal;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--slate2)}
.wl i.W{background:#1f6b40}.wl i.L{background:#7a2626}
.list{font-weight:600;font-size:15px;line-height:1.45}
.list .dim{color:var(--dim)}
textarea.story{width:100%;min-height:96px;background:var(--ink);border:1px solid var(--line);padding:8px;font-weight:600;resize:vertical;line-height:1.4}

/* rosters */
.col h2{display:flex;align-items:baseline;gap:10px;font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:26px;
  border-bottom:5px solid var(--tc);padding-bottom:4px;margin-bottom:6px}
.col h2 span{font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:15px;color:var(--dim)}
.grp{font-weight:700;font-size:13px;color:var(--dim);margin:10px 0 4px;letter-spacing:.02em}
.pc{display:grid;grid-template-columns:54px 1fr;gap:0 10px;background:var(--slate);padding:8px 10px 8px 0;margin-bottom:5px;border-left:5px solid var(--tc)}
.pc.out{opacity:.55}
.pc .jn{font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:38px;line-height:1;text-align:right;grid-row:span 3}
.pc .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pc .name{font-weight:700;font-size:20px}
.pc .pos{font-weight:700;color:var(--dim)}
.pc .inj{font-weight:700;font-size:13px;background:#7a2626;padding:1px 6px}
.pc .inj.q{background:#7a5a10}
.pc .oncourt{font-weight:700;font-size:13px;background:#1f6b40;padding:1px 6px}
.pc .st5{font-weight:700;font-size:12px;color:var(--dim);border:1px solid var(--line);padding:0 5px}
.grp.floor{color:#7fe0a6;display:flex;align-items:center;gap:7px}
.grp.floor::before{content:"";width:9px;height:9px;border-radius:50%;background:#2fbf6a;box-shadow:0 0 0 4px rgba(47,191,106,.2)}
.floorset{border:2px solid #1f6b40;padding:5px 5px 0;margin-bottom:6px;background:rgba(31,107,64,.08)}
.pc .bio{color:var(--dim);font-weight:600;font-size:14px}
.pc .bio b{color:var(--chalk);font-weight:600}
/* tonight = the hero line; season = small context underneath */
.tn{display:flex;align-items:stretch;margin-top:7px;background:var(--ink);border:1px solid var(--line)}
.tn .lab{background:var(--chair);color:#fff;font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:15px;letter-spacing:.05em;padding:0 9px;display:flex;align-items:center}
.tn .st{flex:1;min-width:0;text-align:center;padding:4px 2px 3px}
.tn .st b{display:block;font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:clamp(17px,1.45vw,27px);white-space:nowrap;letter-spacing:-.01em;line-height:1;color:var(--chalk)}
.tn .st i{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.04em;margin-top:2px}
.tn .st.w{flex:1.55}
.tn .st.up b{color:var(--up)} .tn .st.warn b{color:var(--down)}
.tn .none{padding:7px 10px;color:var(--dim);font-weight:600}
.ssn{margin-top:6px;font-size:14px;font-weight:600;color:var(--dim)}
.ssn .lab{display:inline-block;background:var(--desk);color:#fff;font-weight:800;font-size:11px;letter-spacing:.05em;padding:1px 6px;margin-right:6px;vertical-align:1px}
.ssn b{color:#c9c7d6;font-weight:700}
.ssn.big{font-size:17px}
.ssn.big b{color:var(--chalk)}
.pnote{margin-top:5px;color:var(--pencil);font-weight:600;font-size:14px;line-height:1.3;white-space:pre-wrap}
.pnote::before{content:"✎ "}
.fold{margin-top:10px}
.fold summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;padding:6px 8px;background:var(--slate);color:var(--dim);font-weight:600;font-size:14px}
.fold summary::-webkit-details-marker{display:none}
.fold summary::before{content:"▸";color:var(--dim)}
.fold[open] summary::before{content:"▾"}
.fold summary .grp{margin:0;white-space:nowrap}
.fold summary .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .pc{margin-top:5px}
.msg{margin:18px;background:var(--slate);border-left:6px solid var(--chair);padding:12px 14px;font-weight:600;display:none}
.msg.on{display:block}
.loading{margin:30px 18px;color:var(--dim);font-weight:600}

/* print / paper board */
@media print{
  details.fold{display:none}
  @page{size:landscape;margin:8mm}
  :root{--ink:#fff;--slate:#fff;--slate2:#eee;--chalk:#000;--dim:#555;--line:#ccc;--pencil:#000}
  body{font-size:11px}
  .bar form,.pbtn,.status{display:none}
  .box,.pc{border-color:#000}
  .layout{grid-template-columns:1fr 1fr;grid-template-areas:"desk desk" "away home";gap:8px;margin:8px}
  .desk{position:static;max-height:none;flex-direction:row} .desk .box{flex:1}
  .desk .alerts,.detail{display:none}
  .pc{break-inside:avoid;padding:4px 6px 4px 0;margin-bottom:3px;border-bottom:1px solid #ccc}
  .pc .jn{font-size:26px}
  .pc .name{font-size:14px}
  .wl i.W{background:#cfe9d8}.wl i.L{background:#f2cccc}
}

/* player detail: lives in the desk column, never covers a roster */
.pc{cursor:pointer}
.pc:hover{background:var(--slate2)}
.pc.sel{outline:2px solid var(--pencil);outline-offset:-2px}
.detail{background:var(--slate);border-top:5px solid var(--tc,var(--desk));padding:10px 12px 12px}
.detail[hidden]{display:none}
.detail .dh{display:flex;align-items:center;gap:10px}
.detail .jn{font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:38px;line-height:1;color:var(--tc)}
.detail .nm{font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:25px;line-height:1}
.detail .x{margin-left:auto;background:var(--slate2);border:0;color:var(--chalk);font-weight:700;padding:7px 12px;cursor:pointer;white-space:nowrap}
.detail .x:hover{background:var(--chair)}
.detail textarea.pn{width:100%;margin-top:8px;background:var(--ink);border:1px solid var(--line);color:var(--pencil);font-weight:600;font-size:15px;padding:6px 8px;resize:vertical;min-height:2.5em;line-height:1.35}
.detail textarea.pn::placeholder{color:#4a4a63}
.detail h4{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:17px;color:var(--dim);margin:12px 0 6px;letter-spacing:.02em}
.detail h5{font-weight:700;font-size:13px;color:var(--dim);margin:8px 0 3px}
.detail .dim{color:var(--dim);font-weight:600}
.say{list-style:none}
.say li{background:var(--ink);border-left:4px solid var(--pencil);padding:7px 10px;margin-bottom:5px;font-size:17px;font-weight:600;line-height:1.3}
.say li b{color:var(--pencil);font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tile{background:var(--ink);padding:6px 8px}
.tile b{display:block;font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:24px;line-height:1}
.tile i{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--dim);margin-top:3px}
.tile.up b{color:var(--up)} .tile.down b{color:var(--down)}
.detail .two{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.detail table{width:100%;border-collapse:collapse;font-size:14px;font-weight:600}
.detail td,.detail th{padding:3px 5px;border-bottom:1px solid var(--line);text-align:right}
.detail td:first-child,.detail th:first-child{text-align:left}
.detail th{color:var(--dim);font-size:11px}
.detail .foot{font-size:12px;margin-top:12px}

/* compact bench cards */
.pc.mini{grid-template-columns:40px 1fr;padding:5px 8px 5px 0;margin-bottom:4px}
.pc.mini .jn{font-size:24px;grid-row:span 2}
.pc.mini .name{font-size:16px}
.pc.mini .top{gap:6px}
.pc .sl{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--dim)}
.pc .sl b{font-size:14px;color:#c9c7d6;letter-spacing:0;margin-left:3px}
.tn.sm{margin-top:4px}
.tn.sm .lab{font-size:11px;padding:0 6px}
.tn.sm .st{padding:2px 1px}
.tn.sm .st b{font-size:16px}
.tn.sm .st i{font-size:9px;margin-top:1px}
.tn.sm .none{padding:3px 8px;font-size:13px}
.pc.mini .pnote{font-size:13px;margin-top:3px}

/* pulse strip under the score: run, droughts, team fouls, timeouts */
.pulse{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:7px 2px 1px;font-weight:700;font-size:14px;color:var(--chalk)}
.pulse[hidden]{display:none}
.pulse b{display:inline-flex;align-items:center;gap:6px;font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:18px;color:var(--pencil)}
.pulse b i{width:5px;height:16px;background:var(--tc)}
.pulse .dry{color:var(--down)}
.pulse .grpx{color:var(--dim);font-weight:700;font-size:12px;letter-spacing:.03em;margin-right:-6px}
.pulse .pen{color:var(--pencil)}
/* team stats */
.teambox[hidden]{display:none}
.tb{width:100%;border-collapse:collapse;font-weight:700;font-size:14px}
.tb td,.tb th{padding:3px 4px;border-bottom:1px solid var(--line)}
.tb th{font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:17px;text-align:left}
.tb th:last-child,.tb td:last-child{text-align:right}
.tb th i{display:inline-block;width:5px;height:14px;background:var(--tc);margin-right:5px;vertical-align:-1px}
.tb th:last-child i{margin:0 0 0 5px;float:right;margin-top:3px}
.tb td.k{text-align:center;color:var(--dim);font-size:12px;font-weight:700;white-space:nowrap}
.tb td.win{color:var(--up)}
.tbf{color:var(--dim);font-weight:600;font-size:12px;margin-top:5px}
@media print{ .pulse,.teambox{display:none} }
</style>
</head>
<body>
<div class="bar">
  <span class="brand">SportsDesk</span>
  <span class="t">Spotting board</span>
  <span class="mu" id="mu"></span>
  <span class="status" id="status"><i></i><span id="statusTxt">Loading</span></span>
  <form id="f"><label for="team">Team</label><input id="team" maxlength="4" autocomplete="off"><label for="delay">Delay</label><input id="delay" type="number" min="0" max="120" step="1" inputmode="numeric" style="width:58px;text-transform:none" title="Seconds to hold live stats and alerts back so they match your video"><button>Apply</button></form>
  <button class="pbtn" id="print" type="button">Print</button>
</div>
<div class="msg" id="msg"></div>
<div id="app"><p class="loading">Pulling rosters, season averages and the matchup from ESPN…</p></div>

<script>
/* ==================================================================
   https://sportstein.github.io/sportsdesk/board.html?team=BOS
   Options: team, event (ESPN game id), league (nba | wnba | mens-college-basketball | womens-college-basketball),
            days (how far ahead to look for the next game, default 10), poll (live seconds, default 15)
   ================================================================== */
const P = new URLSearchParams(location.search);
const cfg = {
  team: (P.get("team") || "BOS").toUpperCase(),
  event: P.get("event") || "",
  league: P.get("league") || "nba",
  days: Math.min(30, +(P.get("days") || 10)),
  delay: Math.max(0, Math.min(120, +(P.get("delay") || 0))),
  poll: Math.max(5, +(P.get("poll") || (P.get("delay") ? 5 : 15)))
};
const BASE = `https://site.api.espn.com/apis/site/v2/sports/basketball/${cfg.league}`;
const ATH = `https://site.web.api.espn.com/apis/common/v3/sports/basketball/${cfg.league}/athletes`;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
$("#team").value = cfg.team;
$("#delay").value = cfg.delay || "";
$("#f").addEventListener("submit", e => {
  e.preventDefault();
  const t = $("#team").value.trim().toUpperCase(); if (!t) return;
  if (t !== cfg.team){ P.set("team", t); P.delete("event"); }
  const d = Math.max(0, Math.min(120, parseInt($("#delay").value, 10) || 0));
  if (d) P.set("delay", d); else P.delete("delay");
  location.search = P.toString();
});
$("#print").addEventListener("click", () => window.print());

const store = {
  get(k){ try{ return localStorage.getItem("sdboard:" + k) || ""; }catch(e){ return ""; } },
  set(k, v){ try{ localStorage.setItem("sdboard:" + k, v); }catch(e){} }
};
async function J(url){
  const r = await fetch(url + (url.includes("?") ? "&" : "?") + "_=" + Date.now(), { cache:"no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status + " " + url);
  return r.json();
}
function lum(hex){
  const n = parseInt(hex.replace("#",""),16);
  const c = [(n>>16)&255,(n>>8)&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*c[0]+.7152*c[1]+.0722*c[2];
}
function color(p, a){ const ok = h => h && /^[0-9a-f]{6}$/i.test(h); let c = ok(p) ? "#"+p : null; if (!c || lum(c) < .015) c = ok(a) ? "#"+a : "#1a5fa8"; return c; }
const ymd = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
function setStatus(cls, txt){ $("#status").className = "status " + cls; $("#statusTxt").textContent = txt; }

/* ---------- find the game: today, or the next one within `days` ---------- */
async function findEvent(){
  if (cfg.event) return cfg.event;
  const now = new Date();
  for (let i = 0; i <= cfg.days; i++){
    const d = new Date(now); d.setDate(now.getDate() + i);
    try{
      const sb = await J(`${BASE}/scoreboard?dates=${ymd(d)}`);
      const ev = (sb.events || []).find(e => e.competitions[0].competitors.some(c => (c.team.abbreviation || "").toUpperCase() === cfg.team));
      if (ev) return ev.id;
    }catch(e){}
  }
  return null;
}

/* ---------- season averages, one call per player, a few at a time ---------- */
async function pool(items, n, fn){
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length:n }, async () => { while (i < items.length){ const k = i++; try{ out[k] = await fn(items[k]); }catch(e){ out[k] = null; } } }));
  return out;
}
async function seasonOf(id){
  const d = await J(`${ATH}/${id}/overview`);
  const s = d.statistics; if (!s || !s.labels) return null;
  const split = (s.splits || []).find(x => /regular/i.test(x.displayName)) || (s.splits || [])[0];
  if (!split) return null;
  const v = {}; s.labels.forEach((l, i) => v[l.toUpperCase()] = split.stats[i]);
  return v;
}

/* ---------- state ---------- */
const S = { ev:null, teams:{}, players:{}, live:{}, state:"pre", order:[] };
const DR = { id:null, logs:{} };

async function load(){
  setStatus("", "Finding the game");
  const id = await findEvent();
  if (!id){
    $("#app").innerHTML = "";
    $("#msg").textContent = `No ${cfg.team} game in the next ${cfg.days} days. Check the team code (ESPN uses NY, GS, SA, NO, BKN, CHA) or add &event= with a game ID.`;
    $("#msg").classList.add("on"); setStatus("", "No game found"); return;
  }
  S.ev = id;
  const sum = await J(`${BASE}/summary?event=${id}`);
  const comp = sum.header.competitions[0];
  for (const c of comp.competitors){
    const t = c.team, side = c.homeAway;
    S.teams[side] = { id:t.id, abbr:t.abbreviation, name:t.displayName || t.name, short:t.name || t.shortDisplayName,
      color: color(t.color, t.alternateColor), rec: (c.record && c.record[0] && (c.record[0].summary || c.record[0].displayValue)) || "" };
  }
  setStatus("", "Loading rosters");
  const rosters = await Promise.all(["away","home"].map(s => J(`${BASE}/teams/${S.teams[s].id}/roster`).catch(() => ({ athletes:[] }))));
  ["away","home"].forEach((s, i) => {
    S.teams[s].players = (rosters[i].athletes || []).map(a => {
      const p = { id:String(a.id), side:s, name:a.displayName, short:a.shortName || a.displayName, jersey:a.jersey || "",
        pos:(a.position && a.position.abbreviation) || "", ht:a.displayHeight || "", wt:a.displayWeight || "", age:a.age || "",
        exp: a.experience && a.experience.years != null ? a.experience.years : null,
        college: (a.college && (a.college.name || a.college.shortName)) || "",
        inj: a.injuries && a.injuries[0] ? (a.injuries[0].status || a.injuries[0].type || "") : "", season:undefined };
      S.players[p.id] = p; return p;
    });
  });
  // injury report from the game page is more current than the roster's
  for (const ti of sum.injuries || []){
    for (const it of ti.injuries || []){
      const p = it.athlete && S.players[String(it.athlete.id)];
      if (p) p.inj = it.status || (it.type && it.type.description) || p.inj;
    }
  }
  renderShell(sum, comp);
  // the live game goes up first; season averages fill in behind it
  renderTeams();
  if (cfg.delay > 0){ snaps.push({ t:Date.now(), sum }); S.syncing = true; }
  applyLive(sum);
  tick();
  const all = Object.values(S.players);
  pool(all, 6, p => seasonOf(p.id)).then(avgs => {
    all.forEach((p, i) => p.season = avgs[i] || null);
    renderTeams(); if (DR.id) renderDrawer();
  });
}

function groups(side){
  const ps = S.teams[side].players.slice();
  const live = Object.keys(S.live).length > 0;
  const byMin = (a,b) => (num(S.live[b.id] && S.live[b.id].MIN) || 0) - (num(S.live[a.id] && S.live[a.id].MIN) || 0) || (num(b.season && b.season.MIN) || 0) - (num(a.season && a.season.MIN) || 0);
  if (live){
    const starters = ps.filter(p => S.live[p.id] && S.live[p.id].starter);
    if (starters.length){
      // active = in tonight's box score and not marked inactive; everyone else folds away
      const active = p => S.live[p.id] && !S.live[p.id].inactive;
      const inactive = ps.filter(p => !starters.includes(p) && !active(p)).sort(byMin);
      // during play: the five on the floor up top, everyone else who's dressed below
      const floor = ps.filter(p => S.live[p.id] && S.live[p.id].onCourt);
      if (floor.length === 5){
        const order = p => starters.includes(p) ? 0 : 1;
        floor.sort((a, b) => order(a) - order(b) || byMin(a, b));
        const rest = ps.filter(p => !floor.includes(p) && active(p)).sort(byMin);
        return [["On the floor", floor, false, "floor"], ["Bench", rest, false, "", true], [`Inactive (${inactive.length})`, inactive, true, "", true]];
      }
      const bench = ps.filter(p => !starters.includes(p) && active(p)).sort(byMin);
      return [["Starters", starters], ["Bench", bench, false, "", true], [`Inactive (${inactive.length})`, inactive, true, "", true]];
    }
  }
  const out = ps.filter(p => /out/i.test(p.inj)).sort(byMin);
  const avail = ps.filter(p => !/out/i.test(p.inj)).sort(byMin);
  return [["Rotation by minutes (starters post at tip)", avail], [`Out tonight (${out.length})`, out, true]];
}

/* ---------- live: tonight's line next to the season line ---------- */
function applyLive(sum){
  const comp = sum.header.competitions[0], st = comp.status || {}, ty = st.type || {};
  S.state = ty.state || "pre";
  if (S.state !== "pre"){
    if ($("#clk")) $("#clk").textContent = ty.state === "post" ? "Final" : (ty.shortDetail || st.displayClock || "");
  }
  const live = {};
  for (const tp of (sum.boxscore && sum.boxscore.players) || []){
    const stt = tp.statistics && tp.statistics[0]; if (!stt) continue;
    const labels = (stt.labels || stt.names || []).map(x => String(x).toUpperCase());
    for (const a of stt.athletes || []){
      if (!a.athlete) continue;
      const row = { starter: !!a.starter, onCourt: a.active === true && S.state === "in" && ON_COURT_OK,
        inactive: !!a.didNotPlay && /inactive|not with team|suspend|g league/i.test(String(a.reason || "")) };
      if (a.stats && a.stats.length){
        labels.forEach((k, i) => row[k] = a.stats[i]);
        const pct = (ma) => { const m = String(ma || "").match(/(\d+)-(\d+)/); return m ? `${m[1]}-${m[2]}` : "–"; };
        row.FG = pct(row.FG); row["3PT"] = pct(row["3PT"]);
      }
      live[String(a.athlete.id)] = row;
    }
  }
  if (Object.keys(live).length) S.live = live;
  S.sum = sum;
  if (S.state !== "pre") renderTeams();
  try{ renderPulse(sum); renderTeamBox(sum); }catch(e){ console.error(e); }
  if (DR.id) renderDrawer();
}
// ESPN's "active" flag = the five on the floor (checked: exactly 5 per team at the final buzzer). &oncourt=0 hides it
const ON_COURT_OK = P.get("oncourt") !== "0";
const SERIOUS = /out|question|doubt|suspend/i;

let timer = null;
const snaps = []; let shown = null;
async function tick(){
  clearTimeout(timer);
  try{
    let sum = await J(`${BASE}/summary?event=${S.ev}`);
    if (cfg.delay > 0){
      // hold live stats back so they line up with your video
      snaps.push({ t:Date.now(), sum });
      const cutoff = Date.now() - cfg.delay * 1000;
      while (snaps.length && snaps[0].t <= cutoff) shown = snaps.shift().sum;
      if (!shown){ setStatus("", `Syncing to your ${cfg.delay}s delay…`); timer = setTimeout(tick, cfg.poll * 1000); return; }
      sum = shown;
    }
    applyLive(sum);
    if (S.state === "in") setStatus("live", `Live${cfg.delay ? `, ${cfg.delay}s delay` : ""}, updated ` + new Date().toLocaleTimeString([], { hour:"numeric", minute:"2-digit", second:"2-digit" }));
    else if (S.state === "post") setStatus("", "Final");
    else setStatus("", "Pregame, checks for starters every minute");
  }catch(e){ setStatus("", "Feed not responding, retrying"); }
  timer = setTimeout(tick, (S.state === "in" ? cfg.poll : 60) * 1000);
}

/* ---------- player drawer: advanced stats + on-air lines ---------- */
const NQ = /mens-college/.test(cfg.league) && !/womens/.test(cfg.league) ? 2 : 4;
const QLEN = cfg.league === "nba" ? 12 : NQ === 2 ? 20 : 10;
const ma = v => { const m = String(v || "").match(/(\d+)-(\d+)/); return m ? [+m[1], +m[2]] : [0, 0]; };
const sg = n => n > 0 ? `+${n}` : n < 0 ? `−${Math.abs(n)}` : "even";
const r1 = n => n == null || !isFinite(n) ? "–" : (Math.round(n * 10) / 10).toFixed(1);
const r0 = n => n == null || !isFinite(n) ? "–" : String(Math.round(n));
const perName = n => n <= NQ ? `${n}${["","st","nd","rd","th"][Math.min(n,4)]} ${NQ === 2 ? "half" : "quarter"}` : (n - NQ === 1 ? "OT" : `${n - NQ}OT`);
function clockSec(s){ const m = String(s || "").match(/(\d+):(\d+)/); if (m) return +m[1] * 60 + +m[2]; const f = parseFloat(s); return isNaN(f) ? 0 : f; }
function elapsedMin(sum){
  const st = sum.header.competitions[0].status || {}, ty = st.type || {}, per = st.period || 0;
  if (!per) return 0;
  let e = 0; for (let p = 1; p < per; p++) e += p <= NQ ? QLEN : 5;
  const cur = per <= NQ ? QLEN : 5;
  if (ty.state === "post" || /END|HALFTIME/.test(ty.name || "")) return e + cur;
  return e + cur - clockSec(st.displayClock) / 60;
}
function playerPlays(pid, name){
  const shots = [], q = {}, ap = { n:0, pts:0 };
  const astRe = new RegExp("\\(" + name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + " assists\\)", "i");
  for (const p of (S.sum && S.sum.plays) || []){
    const per = (p.period && p.period.number) || 1, txt = String(p.text || "");
    const who = String(p.participants && p.participants[0] && p.participants[0].athlete && p.participants[0].athlete.id || "");
    if (p.shootingPlay && who === pid){
      const ft = /free throw/i.test(txt), three = !ft && /three point|3-pt/i.test(txt), made = !!p.scoringPlay;
      const dist = +((txt.match(/(\d+)-foot/) || [])[1] || 0);
      const zone = ft ? "FT" : three ? "3PT"
        : (/layup|dunk|tip|alley|putback|finger roll/i.test(txt) || (dist && dist <= 4)) ? "Rim"
        : (dist >= 15 || (!dist && /jump|pullup|step back|fadeaway/i.test(txt))) ? "Mid" : "Short";
      const pts = made ? (+p.scoreValue || (ft ? 1 : three ? 3 : 2)) : 0;
      shots.push({ zone, made, assisted: made && /assists\)/i.test(txt), per });
      if (made) q[per] = (q[per] || 0) + pts;
    }
    if (p.scoringPlay && astRe.test(txt)){ ap.n++; ap.pts += +p.scoreValue || 2; }
  }
  return { shots, q, ap };
}
async function logOf(id){
  if (DR.logs[id] !== undefined) return DR.logs[id];
  DR.logs[id] = "pending";
  const parse = d => {
    const labels = (d.labels || []).map(x => String(x).toUpperCase());
    const reg = (d.seasonTypes || []).filter(t => /regular/i.test(t.displayName || ""));
    const seen = new Map();
    const walk = o => { if (!o || typeof o !== "object") return;
      if (o.eventId && Array.isArray(o.stats) && !seen.has(String(o.eventId)) && String(o.eventId) !== String(S.ev)) seen.set(String(o.eventId), o.stats);
      for (const k in o) if (typeof o[k] === "object") walk(o[k]); };
    reg.forEach(walk);
    if (!seen.size) return null;
    const games = [...seen].map(([eid, st]) => {
      const g = {}; labels.forEach((l, i) => g[l] = st[i]);
      const m = (d.events || {})[eid] || {};
      g.date = m.gameDate; g.opp = `${m.atVs || ""} ${(m.opponent && m.opponent.abbreviation) || ""}`.trim(); g.res = m.gameResult || "";
      return g;
    }).sort((a, b) => new Date(b.date) - new Date(a.date));
    return { games, label: (reg[0] && reg[0].displayName) || "Regular season" };
  };
  try{
    let r = parse(await J(`${ATH}/${id}/gamelog`));
    if (!r){ const now = new Date(); r = parse(await J(`${ATH}/${id}/gamelog?season=${now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1}`)); }
    DR.logs[id] = r;
  }catch(e){ DR.logs[id] = null; }
  return DR.logs[id];
}
function seasonFromLog(log){
  if (!log || !log.games.length) return null;
  const g = log.games, n = g.length, tot = k => g.reduce((a, x) => a + (parseFloat(x[k]) || 0), 0);
  let fga = 0, fta = 0, fgm = 0, tpm = 0;
  g.forEach(x => { const f = ma(x.FG), t = ma(x["3PT"]), fr = ma(x.FT); fgm += f[0]; fga += f[1]; tpm += t[0]; fta += fr[1]; });
  const hi = k => g.reduce((b, x) => (parseFloat(x[k]) || 0) > (b ? parseFloat(b[k]) || 0 : -1) ? x : b, null);
  const l5 = g.slice(0, 5), l5avg = k => l5.reduce((a, x) => a + (parseFloat(x[k]) || 0), 0) / l5.length;
  return { n, label: log.label, ts: fga + .44 * fta ? 100 * tot("PTS") / (2 * (fga + .44 * fta)) : null, efg: fga ? 100 * (fgm + .5 * tpm) / fga : null,
    hiP: hi("PTS"), hiR: hi("REB"), hiA: hi("AST"), l5, l5P: l5avg("PTS"), l5R: l5avg("REB"), l5A: l5avg("AST"), ppg: tot("PTS") / n };
}

function renderDrawer(){
  const id = DR.id, p = id && S.players[id]; if (!p) return;
  const t = S.teams[p.side], l = S.live[id], s = p.season || {}, log = DR.logs[id];

  if (played){
    const [fgm, fga] = ma(l.FG), [tpm, tpa] = ma(l["3PT"]), [ftm, fta] = ma(l.FT);
    const pts = +l.PTS || 0, reb = +l.REB || 0, ast = +l.AST || 0, stl = +l.STL || 0, blk = +l.BLK || 0, to = +l.TO || 0, pf = +l.PF || 0, min = +l.MIN || 0;
    const pm = parseInt(String(l["+/-"] || "").replace("−", "-"), 10);
    const tsa = fga + .44 * fta, ts = tsa ? 100 * pts / (2 * tsa) : null, efg = fga ? 100 * (fgm + .5 * tpm) / fga : null;
    const comp = S.sum.header.competitions[0], my = comp.competitors.find(c => c.homeAway === p.side), op = comp.competitors.find(c => c.homeAway !== p.side);
    const teamPts = +my.score || 0, margin = teamPts - (+op.score || 0);
    const offMin = Math.max(0, elapsedMin(S.sum) - min), off = isFinite(pm) ? margin - pm : null;
    const per = (comp.status && comp.status.period) || 0, post = S.state === "post";
    const { shots, q, ap } = playerPlays(id, p.name);
    const z = {}; shots.forEach(x => { const o = z[x.zone] || (z[x.zone] = { m:0, a:0 }); o.a++; if (x.made) o.m++; });
    const fgMade = shots.filter(x => x.made && x.zone !== "FT"), unast = fgMade.filter(x => !x.assisted).length;

    // on-air lines, most useful first
    say.push(`${pts} points on ${fgm}-of-${fga} shooting${tpa ? `, ${tpm}-of-${tpa} from three` : ""}${fta ? `, ${ftm}-of-${fta} at the line` : ""}.`);
    const cats = [["points", pts], ["rebounds", reb], ["assists", ast], ["steals", stl], ["blocks", blk]];
    const tens = cats.filter(c => c[1] >= 10);
    if (tens.length >= 3) say.push(`Triple-double: ${tens.map(c => `${c[1]} ${c[0]}`).join(", ")}.`);
    else if (tens.length === 2) say.push(`Double-double: ${tens.map(c => `${c[1]} ${c[0]}`).join(" and ")}.`);
    else if (tens.length === 1 && !post){ const near = cats.find(c => c[1] >= 8 && c[1] < 10); if (near) say.push(`${10 - near[1]} ${near[0].replace(/s$/, "")}${10 - near[1] > 1 ? "s" : ""} from a double-double.`); }
    if (fga + fta >= 5 && ts != null){
      if (ts >= 62) say.push(`Efficient: ${r0(ts)}% true shooting (league average is about 58%).`);
      else if (ts < 45) say.push(`Tough shooting night: ${r0(ts)}% true shooting.`);
    }
    if (isFinite(pm) && min >= 3) say.push(`${t.short} are ${sg(pm)} in his ${min} minutes${offMin >= 3 && off != null ? `, ${sg(off)} in the ${Math.round(offMin)} without him` : ""}.`);
    const qs = Object.entries(q).sort((a, b) => b[1] - a[1]);
    if (qs.length && qs[0][1] >= 8) say.push(`${qs[0][1]} points in the ${perName(+qs[0][0])}.`);
    if (z.Rim && z.Rim.a >= 3) say.push(`${z.Rim.m}-of-${z.Rim.a} at the rim.`);
    if (fgMade.length >= 3) say.push(unast >= fgMade.length / 2 ? `${unast} of his ${fgMade.length} field goals unassisted.` : `${fgMade.length - unast} of his ${fgMade.length} field goals assisted.`);
    if (ap.n >= 3) say.push(`His ${ap.n} assists have created ${ap.pts} points.`);
    if (pts >= 10 && teamPts) say.push(`${pts} of ${t.abbr}'s ${teamPts} points (${Math.round(100 * pts / teamPts)}%).`);
    const avg = num(s.PTS);
    if (avg && pts >= avg && pts >= 8) say.push(`${post ? "Topped" : "Already past"} his season average of ${avg} points.`);
    const ravg = num(s.REB); if (ravg && reb >= ravg && reb >= 6) say.push(`${reb} rebounds, season average ${ravg}.`);
    if (sea && sea.hiP){ const hi = parseFloat(sea.hiP.PTS) || 0;
      if (pts > hi && pts >= 10) say.push(`Season high: previous best was ${hi}${sea.hiP.opp ? ` ${sea.hiP.opp}` : ""}.`);
      else if (pts >= 10 && hi - pts <= 6) say.push(`${hi - pts} away from his season high of ${hi}.`); }
    if (pf >= 4 || (pf >= 3 && per <= Math.ceil(NQ / 2))) say.push(`Foul trouble: ${pf} fouls${per ? ` in the ${perName(per)}` : ""}.`);
    if (to >= 4) say.push(`${to} turnovers.`);

    const tile = (v, k, cls = "") => `<div class="tile${cls}"><b>${v}</b><i>${k}</i></div>`;
    const zrow = (k, lab) => { const o = k === "FT" ? { m:ftm, a:fta } : z[k]; if (!o || !o.a) return ""; return `<tr><td>${lab}</td><td>${o.m}-${o.a}</td><td>${r0(100 * o.m / o.a)}%</td></tr>`; };
    const nper = Math.max(per, NQ);
    tonight = `<h4>Tonight, advanced</h4>
      <div class="tiles">
        ${tile(ts == null ? "–" : r0(ts) + "%", "True shooting", ts >= 62 ? " up" : ts != null && ts < 45 ? " down" : "")}
        ${tile(efg == null ? "–" : r0(efg) + "%", "Effective FG")}
        ${tile(isFinite(pm) ? sg(pm) : "–", "+/- on floor", pm > 0 ? " up" : pm < 0 ? " down" : "")}
        ${tile(off == null ? "–" : sg(off), `Team without him${offMin ? ` (${Math.round(offMin)} min)` : ""}`)}
        ${tile(to ? r1(ast / to) : ast ? ast + ":0" : "–", "Assist to turnover")}
        ${tile(ap.pts || 0, "Points from his assists")}
        ${tile(fga ? r1(pts / fga) : "–", "Points per shot")}
        ${tile(`${+l.OREB || 0}/${+l.DREB || 0}`, "Off/def rebounds")}
        ${tile(fgMade.length ? `${unast}/${fgMade.length}` : "–", "Unassisted FGs")}
      </div>
      <div class="two">
        <div><h5>Shot zones</h5><table>${zrow("Rim", "At the rim")}${zrow("Short", "Short (5–14 ft)")}${zrow("Mid", "Midrange")}${zrow("3PT", "Three")}${zrow("FT", "Free throws")}</table>${shots.length ? "" : '<p class="dim">No shots logged yet.</p>'}</div>
        <div><h5>Points by ${NQ === 2 ? "half" : "quarter"}</h5><table>${Array.from({ length:nper }, (_, i) => i + 1).filter(n => n <= Math.max(per, 1)).map(n => `<tr><td>${esc(perName(n).replace(/ (quarter|half)/, ""))}</td><td>${q[n] || 0}</td></tr>`).join("")}</table></div>
      </div>`;
  } else if (l){
    tonight = `<h4>Tonight</h4><p class="dim">${l.inactive ? "Inactive." : S.state === "post" ? "Did not play." : "Hasn't checked in yet."}</p>`;
  }

  // season context (also the pregame lines)
  let season = "";
  if (sea){
    if (!played){
      say.push(`Averaging ${s.PTS ?? r1(sea.ppg)} points${s.REB ? `, ${s.REB} rebounds` : ""}${s.AST ? ` and ${s.AST} assists` : ""}.`);
      say.push(`Last ${sea.l5.length}: ${r1(sea.l5P)} points, ${r1(sea.l5R)} rebounds, ${r1(sea.l5A)} assists.`);
      if (sea.hiP) say.push(`Season high ${sea.hiP.PTS} points${sea.hiP.opp ? ` ${sea.hiP.opp}` : ""}.`);
      if (sea.ts != null) say.push(`${r0(sea.ts)}% true shooting on the season.`);
    }
    season = `<h4>${esc(sea.label)} (${sea.n} games)</h4>
      <div class="tiles">
        <div class="tile"><b>${sea.ts == null ? "–" : r0(sea.ts) + "%"}</b><i>True shooting</i></div>
        <div class="tile"><b>${sea.efg == null ? "–" : r0(sea.efg) + "%"}</b><i>Effective FG</i></div>
        <div class="tile"><b>${r1(sea.l5P)}</b><i>PPG, last ${sea.l5.length}</i></div>
        <div class="tile"><b>${esc(sea.hiP ? sea.hiP.PTS : "–")}</b><i>High pts${sea.hiP && sea.hiP.opp ? " " + esc(sea.hiP.opp) : ""}</i></div>
        <div class="tile"><b>${esc(sea.hiR ? sea.hiR.REB : "–")}</b><i>High reb${sea.hiR && sea.hiR.opp ? " " + esc(sea.hiR.opp) : ""}</i></div>
        <div class="tile"><b>${esc(sea.hiA ? sea.hiA.AST : "–")}</b><i>High ast${sea.hiA && sea.hiA.opp ? " " + esc(sea.hiA.opp) : ""}</i></div>
      </div>
      <h5>Last ${sea.l5.length}</h5>
      <table class="log"><tr><th></th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>FG</th><th>3PT</th></tr>
        ${sea.l5.map(g => `<tr><td>${esc(g.date ? new Date(g.date).toLocaleDateString([], { month:"short", day:"numeric" }) : "")} ${esc(g.opp)} <span class="dim">${esc(g.res)}</span></td><td>${esc(g.MIN)}</td><td>${esc(g.PTS)}</td><td>${esc(g.REB)}</td><td>${esc(g.AST)}</td><td>${esc(g.FG)}</td><td>${esc(g["3PT"])}</td></tr>`).join("")}</table>`;
  } else if (log === "pending"){
    season = `<h4>Season</h4><p class="dim">Loading his game log…</p>`;
  } else {
    season = `<h4>Season</h4><p class="dim">No game log on ESPN yet.</p>`;
    if (!played && p.season) say.push(`Averaging ${s.PTS} points, ${s.REB} rebounds and ${s.AST} assists.`);
  }

  const body = $("#dBody"); if (!body) return;
  body.innerHTML = `
    <h4>On-air lines</h4>
    ${say.length ? `<ul class="say">${say.map(x => `<li>${hl(x)}</li>`).join("")}</ul>` : '<p class="dim">Nothing yet.</p>'}
    ${tonight}${season}
    <p class="dim foot">From ESPN's box score and play-by-play${cfg.delay ? `, on your ${cfg.delay}s delay` : ""}. Updates live. Esc or click the card again to close.</p>`;
}

/* ---------- team box + the pulse strip (run, drought, fouls, timeouts) ---------- */
function teamStats(sum){
  const out = {};
  for (const t of (sum.boxscore && sum.boxscore.teams) || []){
    const side = String(t.team.id) === S.teams.away.id ? "away" : "home", v = {};
    (t.statistics || []).forEach(x => v[x.name] = x.displayValue);
    out[side] = v;
  }
  return out.away && out.home ? out : null;
}
function renderTeamBox(sum){
  const el = $("#teamBox"); if (!el) return;
  const T = teamStats(sum);
  if (!T || S.state === "pre"){ el.hidden = true; return; }
  el.hidden = false;
  const A = S.teams.away, H = S.teams.home;
  const n = v => parseFloat(v) || 0;
  // [label, away value, home value, which number decides "better", higher is better?]
  const rows = [
    ["FG", `${T.away["fieldGoalsMade-fieldGoalsAttempted"]} · ${T.away.fieldGoalPct}%`, `${T.home["fieldGoalsMade-fieldGoalsAttempted"]} · ${T.home.fieldGoalPct}%`, n(T.away.fieldGoalPct), n(T.home.fieldGoalPct), 1],
    ["3PT", `${T.away["threePointFieldGoalsMade-threePointFieldGoalsAttempted"]} · ${T.away.threePointFieldGoalPct}%`, `${T.home["threePointFieldGoalsMade-threePointFieldGoalsAttempted"]} · ${T.home.threePointFieldGoalPct}%`, n(T.away.threePointFieldGoalPct), n(T.home.threePointFieldGoalPct), 1],
    ["FT", T.away["freeThrowsMade-freeThrowsAttempted"], T.home["freeThrowsMade-freeThrowsAttempted"], n(T.away.freeThrowPct), n(T.home.freeThrowPct), 1],
    ["Paint", T.away.pointsInPaint, T.home.pointsInPaint, n(T.away.pointsInPaint), n(T.home.pointsInPaint), 1],
    ["Fast break", T.away.fastBreakPoints, T.home.fastBreakPoints, n(T.away.fastBreakPoints), n(T.home.fastBreakPoints), 1],
    // ESPN lists points *conceded* off turnovers, so each team's figure is the other side's number
    ["Pts off TO", T.home.turnoverPoints, T.away.turnoverPoints, n(T.home.turnoverPoints), n(T.away.turnoverPoints), 1],
    ["Rebounds", `${T.away.totalRebounds} (${T.away.offensiveRebounds} off)`, `${T.home.totalRebounds} (${T.home.offensiveRebounds} off)`, n(T.away.totalRebounds), n(T.home.totalRebounds), 1],
    ["Assists", T.away.assists, T.home.assists, n(T.away.assists), n(T.home.assists), 1],
    ["Turnovers", T.away.totalTurnovers || T.away.turnovers, T.home.totalTurnovers || T.home.turnovers, n(T.away.totalTurnovers || T.away.turnovers), n(T.home.totalTurnovers || T.home.turnovers), -1],
    ["Largest lead", T.away.largestLead, T.home.largestLead, n(T.away.largestLead), n(T.home.largestLead), 1]
  ];
  const cell = (v, me, them, dir) => `<td class="${me * dir > them * dir ? "win" : ""}">${esc(v ?? "–")}</td>`;
  el.innerHTML = `<h3>Team stats</h3><table class="tb">
    <tr><th style="--tc:${A.color}"><i></i>${esc(A.abbr)}</th><th></th><th style="--tc:${H.color}"><i></i>${esc(H.abbr)}</th></tr>
    ${rows.map(([k, a, h, na, nh, dir]) => `<tr>${cell(a, na, nh, dir)}<td class="k">${k}</td>${cell(h, nh, na, dir)}</tr>`).join("")}
  </table>${T.away.leadChanges ? `<p class="tbf">${esc(T.away.leadChanges)} lead changes · ${esc(A.abbr)} led ${esc(T.away.leadPercentage)}% of the game, ${esc(H.abbr)} ${esc(T.home.leadPercentage)}%</p>` : ""}`;
}

function gameSec(per, clock){
  let e = 0; for (let p = 1; p < per; p++) e += (p <= NQ ? QLEN : 5) * 60;
  return e + (per <= NQ ? QLEN : 5) * 60 - clock;
}
function renderPulse(sum){
  const el = $("#pulse"); if (!el) return;
  if (S.state === "pre"){ el.hidden = true; return; }
  const plays = sum.plays || [], A = S.teams.away, H = S.teams.home;
  const sideOf = id => String(id) === A.id ? "away" : String(id) === H.id ? "home" : null;
  const st = sum.header.competitions[0].status || {}, per = st.period || 1, nowSec = S.state === "post" ? Infinity : gameSec(per, clockSec(st.displayClock));
  // current run, same rule as the alerts: the running team can give up 4 before it's broken
  let run = null, lastFG = { away:null, home:null };
  for (const p of plays){
    const sd = sideOf(p.team && p.team.id); if (!sd) continue;
    const t = gameSec((p.period && p.period.number) || 1, clockSec(p.clock && p.clock.displayValue));
    if (p.scoringPlay){
      const pts = +p.scoreValue || 0; if (!pts) continue;
      if (!run) run = { side:sd, a:0, b:0, tail:0 };
      if (sd === run.side){ run.a += pts; run.tail = 0; }
      else { run.b += pts; run.tail += pts; if (run.b > 4) run = { side:sd, a:run.tail, b:0, tail:0 }; }
      if (!/free throw/i.test(p.text || "")) lastFG[sd] = t;
    }
  }
  const bits = [];
  if (run && run.a >= 5 && run.a - run.b >= 5) bits.push(`<b style="--tc:${S.teams[run.side].color}"><i></i>${esc(S.teams[run.side].abbr)} on a ${run.a}-${run.b} run</b>`);
  if (S.state === "in"){
    for (const sd of ["away","home"]){
      const since = lastFG[sd] == null ? nowSec : nowSec - lastFG[sd];
      if (since >= 120) bits.push(`<span class="dry">${esc(S.teams[sd].abbr)} no FG in ${Math.floor(since / 60)}:${String(Math.floor(since % 60)).padStart(2, "0")}</span>`);
    }
  }
  // team fouls this period (offensive fouls and technicals don't count) and timeouts
  if (cfg.league === "nba" || cfg.league === "wnba"){
    const f = { away:0, home:0 }, l2 = { away:0, home:0 }, to = { away:0, home:0 }, toQ4 = { away:0, home:0 }, toL3 = { away:0, home:0 };
    const pLen = (per <= NQ ? QLEN : 5) * 60;
    for (const p of plays){
      const ty = String((p.type && p.type.text) || ""), sd = sideOf(p.team && p.team.id); if (!sd) continue;
      const pp = (p.period && p.period.number) || 1, ck = clockSec(p.clock && p.clock.displayValue);
      if (/timeout/i.test(ty) && !/official/i.test(ty)){ to[sd]++; if (pp === 4) toQ4[sd]++; if (pp === 4 && ck <= 180) toL3[sd]++; }
      if (pp !== per || !/foul/i.test(ty) || /offensive|technical|turnover/i.test(ty)) continue;
      f[sd]++; if (ck <= 120) l2[sd]++;
    }
    const cap = per > NQ ? 3 : 4;
    const ck = clockSec(st.displayClock);
    const fl = sd => { const pen = f[sd] >= cap || (ck <= 120 && l2[sd] >= 1);
      return `<span class="${pen ? "pen" : ""}">${esc(S.teams[sd].abbr)} ${f[sd]}${pen ? " · penalty" : ""}</span>`; };
    if (S.state === "in") bits.push(`<span class="grpx">Fouls ${per > NQ ? "OT" : "Q" + per}</span>${fl("away")}${fl("home")}`);
    if (cfg.league === "nba" && S.state === "in" && per <= NQ){
      const left = sd => { let x = 7 - to[sd]; if (per === 4) x = Math.min(x, 4 - toQ4[sd]); if (per === 4 && ck <= 180) x = Math.min(x, 2 - toL3[sd]); return Math.max(0, x); };
      bits.push(`<span class="grpx">Timeouts left</span><span>${esc(A.abbr)} ${left("away")}</span><span>${esc(H.abbr)} ${left("home")}</span>`);
    }
  }
  el.hidden = !bits.length;
  el.innerHTML = bits.join("");
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && DR.id) closePlayer(); });
document.addEventListener("click", e => {
  const c = e.target.closest && e.target.closest(".pc");
  if (!c) return;
  if (c.dataset.pid === DR.id) closePlayer(); else openPlayer(c.dataset.pid);
});
</script>
</body>
</html>
